name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions はタグではなく commit SHA で固定する（タグの付け替えに追従しない）。
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: CSS custom properties (every var() has a definition)
        run: npm run check:cssvars
      - name: Production dependency audit
        run: npm audit --omit=dev
      # dev 依存の high を見逃さない（--omit=dev だけだと playwright のような
      # 開発時依存の脆弱性が永久に検出されない）。v1.0.17 で追加。
      - name: Dependency audit (including dev)
        run: npm audit --audit-level=high
      - name: Build all four editions
        run: npm run build
      # 期待する版の一覧は scripts/lib/editions.mjs が唯一の定義。
      # ここにパスを書き写すと、版を足したときに黙って検査が漏れる（診断 V13）。
      - name: Check built editions
        run: npm run check:editions

  # ビルド成果物を実ブラウザで開く最小のスモークテスト。
  # 「4 版が白画面にならない」「CSP ヘッダがある」「配色が切り替わる」
  # 「共有エンジンが配られている」を、人が見る前に検出する。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build all four editions
        run: npm run build
      - name: Editions present (derived from scripts/lib/editions.mjs)
        run: npm run check:editions
      - name: Header rules (no duplicate / order-independent)
        run: npm run check:headers
      - name: Headless smoke test
        run: npm run smoke
        env:
          # ブラウザが無いときに「何も検証せず緑」にならないようにする
          SMOKE_REQUIRE_BROWSER: '1'
      - name: Colour contrast (all four editions, visible text only)
        run: npm run check:contrast
      - name: Colour modes (six palettes)
        run: npm run check:colours
      - name: Theme bootstrap (no flash of light)
        run: npm run check:theme
